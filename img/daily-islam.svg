<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Daily Islam cover: the app's home screen (next prayer by location, core modules, offline badge),
       flanked by the offline-first SQLite sync and the day's prayer times. Key content stays in the
       centre so it survives the featured row's portrait crop. -->
  <defs>
    <pattern id="star" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.2">
        <rect x="22" y="22" width="36" height="36"/>
        <rect x="22" y="22" width="36" height="36" transform="rotate(45 40 40)"/>
      </g>
    </pattern>
    <radialGradient id="glowTeal" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.15" cy="0.15" r="0.35">
      <stop offset="0" stop-color="#f5c76b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5c76b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prayerCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="1600" height="900" fill="#000"/>
      <circle cx="250" cy="170" r="70" fill="#fff"/>
      <circle cx="280" cy="150" r="62" fill="#000"/>
    </mask>
    <clipPath id="screen"><rect x="652" y="74" width="296" height="752" rx="34"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#08131d"/>
  <rect width="1600" height="900" fill="url(#star)"/>
  <rect width="1600" height="900" fill="url(#glowTeal)"/>
  <rect width="1600" height="900" fill="url(#glowGold)"/>
  <rect width="1600" height="900" fill="#f5c76b" mask="url(#crescent)" opacity="0.85"/>
  <g fill="#f5c76b" opacity="0.7">
    <circle cx="360" cy="250" r="3"/><circle cx="1380" cy="140" r="2.5"/><circle cx="1290" cy="760" r="2"/><circle cx="150" cy="700" r="2.5"/>
  </g>

  <!-- Left: offline-first storage with sync -->
  <g transform="translate(300 300)">
    <rect width="300" height="230" rx="20" fill="#0d1117" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="44" fill="#5eead4" font-size="15" font-weight="700" letter-spacing="2">OFFLINE-FIRST</text>
    <g transform="translate(24 70)" fill="none" stroke="#5eead4" stroke-width="2.5">
      <ellipse cx="34" cy="10" rx="34" ry="10"/>
      <path d="M0 10v44c0 5.5 15 10 34 10s34-4.5 34-10V10"/>
      <path d="M0 32c0 5.5 15 10 34 10s34-4.5 34-10"/>
    </g>
    <text x="112" y="96" fill="#e6edf3" font-size="20" font-weight="600">SQLite</text>
    <text x="112" y="122" fill="#9ba7b4" font-size="15">on the device</text>
    <g transform="translate(24 166)">
      <rect width="252" height="40" rx="20" fill="#14b8a6" fill-opacity="0.12" stroke="#14b8a6" stroke-opacity="0.4"/>
      <path d="M26 14a10 10 0 1 1-3 12M26 14v-5M26 14h-5" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round"/>
      <text x="46" y="26" fill="#ccfbf1" font-size="15">Syncs when back online</text>
    </g>
  </g>

  <!-- Right: today's prayer times -->
  <g transform="translate(1000 250)">
    <rect width="300" height="330" rx="20" fill="#0d1117" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="44" fill="#f5c76b" font-size="15" font-weight="700" letter-spacing="2">PRAYER TIMES</text>
    <g font-size="18" fill="#c9d1d9">
      <text x="24" y="96">Fajr</text><text x="276" y="96" text-anchor="end">05:12</text>
      <text x="24" y="148">Dhuhr</text><text x="276" y="148" text-anchor="end">12:58</text>
      <rect x="12" y="170" width="276" height="44" rx="12" fill="#14b8a6" fill-opacity="0.16" stroke="#14b8a6" stroke-opacity="0.5"/>
      <text x="24" y="199" fill="#ffffff" font-weight="700">Asr</text><text x="276" y="199" fill="#ffffff" font-weight="700" text-anchor="end">15:42</text>
      <text x="24" y="252">Maghrib</text><text x="276" y="252" text-anchor="end">18:21</text>
      <text x="24" y="304">Isha</text><text x="276" y="304" text-anchor="end">19:47</text>
    </g>
  </g>

  <!-- Phone -->
  <rect x="636" y="58" width="328" height="784" rx="48" fill="#05090f" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="652" y="74" width="296" height="752" fill="#0b1520"/>
    <text x="676" y="108" fill="#e6edf3" font-size="14" font-weight="600">9:41</text>
    <rect x="760" y="88" width="80" height="22" rx="11" fill="#05090f"/>

    <text x="676" y="152" fill="#9ba7b4" font-size="14">Assalamu alaikum</text>
    <text x="676" y="182" fill="#ffffff" font-size="26" font-weight="700">Daily Islam</text>

    <!-- Next prayer by location -->
    <rect x="672" y="204" width="256" height="150" rx="20" fill="url(#prayerCard)"/>
    <text x="692" y="236" fill="#ccfbf1" font-size="12" font-weight="700" letter-spacing="1.5">NEXT PRAYER</text>
    <text x="692" y="282" fill="#ffffff" font-size="38" font-weight="700">Asr</text>
    <text x="908" y="282" fill="#ffffff" font-size="26" font-weight="600" text-anchor="end">15:42</text>
    <path d="M698 306c-6 0-10 4.5-10 10 0 7 10 16 10 16s10-9 10-16c0-5.5-4-10-10-10z" fill="#f5c76b"/>
    <circle cx="698" cy="316" r="3.5" fill="#0f766e"/>
    <text x="716" y="322" fill="#ccfbf1" font-size="13">Based on your location</text>
    <rect x="692" y="336" width="216" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="692" y="336" width="140" height="5" rx="2.5" fill="#f5c76b"/>

    <!-- Modules -->
    <g font-size="15" font-weight="600" fill="#e6edf3" text-anchor="middle">
      <rect x="672" y="374" width="122" height="104" rx="18" fill="#132131" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M714 410c8-4 16-4 19 0v30c-3-4-11-4-19 0zM752 410c-8-4-16-4-19 0v30c3-4 11-4 19 0z" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="733" y="464">Quran</text>

      <rect x="806" y="374" width="122" height="104" rx="18" fill="#132131" stroke="#ffffff" stroke-opacity="0.07"/>
      <path d="M867 402l5 11 12 1.5-9 8 2.5 12-10.5-6-10.5 6 2.5-12-9-8 12-1.5z" fill="none" stroke="#f5c76b" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="867" y="464">Dua</text>

      <rect x="672" y="490" width="122" height="104" rx="18" fill="#132131" stroke="#ffffff" stroke-opacity="0.07"/>
      <g fill="none" stroke="#79c0ff" stroke-width="2.2"><rect x="715" y="512" width="10" height="36" rx="2"/><rect x="729" y="508" width="10" height="40" rx="2"/><rect x="744" y="514" width="10" height="34" rx="2" transform="rotate(-12 749 531)"/></g>
      <text x="733" y="580">Books</text>

      <rect x="806" y="490" width="122" height="104" rx="18" fill="#132131" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="867" cy="530" r="19" fill="none" stroke="#5eead4" stroke-width="2.2"/>
      <path d="M867 518v12l8 6" fill="none" stroke="#5eead4" stroke-width="2.2" stroke-linecap="round"/>
      <text x="867" y="580">Prayers</text>
    </g>

    <!-- Offline badge -->
    <rect x="672" y="610" width="256" height="58" rx="16" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-opacity="0.35"/>
    <circle cx="696" cy="639" r="6" fill="#4ade80"/>
    <text x="712" y="635" fill="#e6edf3" font-size="14" font-weight="600">Available offline</text>
    <text x="712" y="655" fill="#9ba7b4" font-size="12">Saved on this device</text>

    <!-- Daily dua -->
    <rect x="672" y="682" width="256" height="64" rx="16" fill="#132131"/>
    <text x="692" y="708" fill="#f5c76b" font-size="11" font-weight="700" letter-spacing="1.5">DUA OF THE DAY</text>
    <rect x="692" y="720" width="190" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="692" y="732" width="130" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>

    <!-- Tab bar -->
    <rect x="652" y="760" width="296" height="66" fill="#0d1a27"/>
    <g fill="#9ba7b4" font-size="11" text-anchor="middle">
      <circle cx="696" cy="784" r="5" fill="#5eead4"/><text x="696" y="806" fill="#5eead4">Home</text>
      <circle cx="748" cy="784" r="5"/><text x="748" y="806">Quran</text>
      <circle cx="800" cy="784" r="5"/><text x="800" y="806">Dua</text>
      <circle cx="852" cy="784" r="5"/><text x="852" y="806">Books</text>
      <circle cx="904" cy="784" r="5"/><text x="904" y="806">Profile</text>
    </g>
  </g>
</svg>
